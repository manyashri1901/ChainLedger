name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Contract tests
        working-directory: contracts
        run: |
          npm ci
          npm test

      - name: Start local chain and seed sample data
        working-directory: contracts
        run: |
          nohup npm run node > node.log 2>&1 &
          sleep 15
          npm run seed

      - name: Python tests
        run: |
          pip install -r requirements.txt -r requirements-api.txt
          python -m pytest -v

      - name: Drift report
        run: |
          python -m indexer.index_events --verify
          python -m registry.load_registry
          python -m reconcile.run

      - name: Drift report using the registry API
        run: |
          nohup python -m uvicorn registry_api.server:app --port 8000 > api.log 2>&1 &
          sleep 5
          REGISTRY_API_URL=http://127.0.0.1:8000 python -m registry.load_registry
          REGISTRY_API_URL=http://127.0.0.1:8000 python -m reconcile.run
          cat api.log

